<section class="mc-inicio-hero">

          <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a2a2a"/>

        <!-- Círculo de fondo -->

        <rect x="170" y="90" width="180" height="340" rx="26" fill="url(#phoneGrad)" stroke="#555" stroke-width="1.5"/>
        <rect x="178" y="108" width="164" height="304" rx="6" fill="#ffffff"/>
